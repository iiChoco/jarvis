<!doctype html>
<!-- The Chart: Ciel's local GUI. Served by ciel/remote/web.py, which also
     documents the WebSocket protocol this page speaks. Deliberately one
     self-contained file with zero external assets: it must render in a
     library basement with no network beyond the loopback.

     The look is "Instrument" (design 2a): a holographic HUD where cyan is
     structure and gold is voice — cut-corner chips, mono meta, scanlines,
     corner brackets around the viewport; Ciel answers in a serif, you in
     cut-corner glass. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ccircle cx='64' cy='64' r='58' fill='none' stroke='%23e8c98a' stroke-opacity='.5' stroke-width='7' stroke-dasharray='4 12'/%3E%3Ccircle cx='64' cy='64' r='34' fill='none' stroke='%23a0f0ff' stroke-opacity='.7' stroke-width='7'/%3E%3Ccircle cx='64' cy='64' r='12' fill='%23e8c98a'/%3E%3C/svg%3E">
<style>
  :root {
    /* cyan is structure */
    --line: rgba(140, 240, 255, .14);
    --line-strong: rgba(140, 240, 255, .22);
    --glass-border: rgba(160, 240, 255, .28);
    --text: #dfe6e6;
    --text-dim: rgba(223, 230, 230, .65);
    --text-faint: rgba(223, 230, 230, .34);
    /* gold is voice and anything that wants you */
    --gold: #e8c98a;
    --gold-dim: rgba(232, 201, 138, .45);
    --gold-line: rgba(232, 201, 138, .16);
    --serif: Georgia, "Times New Roman", serif;
    --mono: ui-monospace, Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    /* the HUD's state vocabulary */
    --st-idle: #8fa8b3;
    --st-listening: #7adea8;
    --st-thinking: #e8c98a;
    --st-reasoning: #b89be8;
    --st-speaking: #a0f0ff;
    --st-error: #e88a8a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 85% at 50% -10%, #0b1922 0%, #050c11 55%, #030608 100%) #030608;
    color: var(--text);
    font: 14.5px/1.55 var(--sans);
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; background: none; border: none; color: inherit; cursor: pointer; padding: 0; }
  :focus-visible { outline: 1px solid rgba(160, 240, 255, .55); outline-offset: 2px; }

  @keyframes br { 0%, 100% { opacity: .45; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes ha { 0%, 100% { opacity: .5; } 50% { opacity: .95; } }

  /* the projection: scanlines over everything, brackets at the corners */
  #scan {
    position: fixed; inset: 0; z-index: 50;
    pointer-events: none; opacity: .3;
    background: repeating-linear-gradient(180deg, rgba(160, 240, 255, .05) 0 1px, transparent 1px 3px);
  }
  .corner { position: fixed; z-index: 51; width: 13px; height: 13px; pointer-events: none; }
  .corner.tl { top: 10px; left: 10px;  border-left: 1px solid rgba(232, 201, 138, .6);  border-top: 1px solid rgba(232, 201, 138, .6); }
  .corner.tr { top: 10px; right: 10px; border-right: 1px solid rgba(232, 201, 138, .6); border-top: 1px solid rgba(232, 201, 138, .6); }
  .corner.bl { bottom: 10px; left: 10px;  border-left: 1px solid rgba(232, 201, 138, .35);  border-bottom: 1px solid rgba(232, 201, 138, .35); }
  .corner.br { bottom: 10px; right: 10px; border-right: 1px solid rgba(232, 201, 138, .35); border-bottom: 1px solid rgba(232, 201, 138, .35); }

  /* cut-corner chips — the one shape the whole instrument is made of */
  .chip {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--line-strong);
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    font: 600 10px/1 var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--st-idle); flex: none; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .wordmark { font: 400 18px/1 var(--serif); letter-spacing: .24em; color: #f3efe6; }
  .aperture .c-outer { stroke: rgba(232, 201, 138, .35); }
  .aperture .c-mid   { stroke: rgba(160, 240, 255, .5); }
  .aperture .c-core  { fill: rgba(232, 201, 138, .85); }
  body[data-state="thinking"] .aperture,
  body[data-state="reasoning"] .aperture { animation: ha 4s ease-in-out infinite; }
  body[data-state="thinking"] .aperture .c-outer,
  body[data-state="reasoning"] .aperture .c-outer { stroke: rgba(232, 201, 138, .5); }
  body[data-state="thinking"] .aperture .c-mid,
  body[data-state="reasoning"] .aperture .c-mid { stroke: rgba(232, 201, 138, .6); }
  body[data-state="thinking"] .aperture .c-core,
  body[data-state="reasoning"] .aperture .c-core { fill: var(--gold); }
  .spacer { flex: 1; }

  /* the state pill: six values, color is the message */
  #state { padding: 6px 13px 6px 10px; letter-spacing: .22em; background: rgba(143, 168, 179, .1); border-color: rgba(143, 168, 179, .42); color: #b6c6cd; }
  #state .dot { background: var(--st-idle); }
  body[data-state="listening"] #state { background: rgba(122, 222, 168, .1); border-color: rgba(122, 222, 168, .5); color: #a6ecc7; }
  body[data-state="listening"] #state .dot { background: var(--st-listening); box-shadow: 0 0 9px var(--st-listening); animation: br 3.4s ease-in-out infinite; }
  body[data-state="thinking"] #state { background: rgba(232, 201, 138, .12); border-color: rgba(232, 201, 138, .55); color: #f0dbaf; }
  body[data-state="thinking"] #state .dot { background: var(--st-thinking); box-shadow: 0 0 9px var(--st-thinking); animation: br 3.4s ease-in-out infinite; }
  body[data-state="reasoning"] #state { background: rgba(184, 155, 232, .12); border-color: rgba(184, 155, 232, .55); color: #d2bef4; }
  body[data-state="reasoning"] #state .dot { background: var(--st-reasoning); box-shadow: 0 0 9px var(--st-reasoning); animation: br 3.4s ease-in-out infinite; }
  body[data-state="speaking"] #state { background: rgba(160, 240, 255, .12); border-color: rgba(160, 240, 255, .6); color: #c7f4fd; }
  body[data-state="speaking"] #state .dot { background: var(--st-speaking); box-shadow: 0 0 9px var(--st-speaking); animation: br 1.6s ease-in-out infinite; }
  body[data-state="error"] #state { background: rgba(232, 138, 138, .12); border-color: rgba(232, 138, 138, .6); color: #f3b7b7; }
  body[data-state="error"] #state .dot { background: var(--st-error); box-shadow: 0 0 9px var(--st-error); }

  /* the active-agent roster: a chip that counts, a panel that lists */
  #agentsbtn { border-color: rgba(232, 201, 138, .4); color: var(--gold); }
  #agentsbtn:hover { border-color: rgba(232, 201, 138, .7); }
  #agentsbtn[hidden] { display: none; }
  #agentsbtn .arr { opacity: .6; letter-spacing: 0; }
  #agentsbtn.deep { background: rgba(184, 155, 232, .12); border-color: rgba(184, 155, 232, .55); color: #d2bef4; }

  #mute:hover { border-color: rgba(140, 240, 255, .45); color: var(--text); }
  body.muted #mute { background: rgba(143, 168, 179, .12); border-color: rgba(143, 168, 179, .45); color: #b6c6cd; }

  /* the restart chip: quiet until armed, gold while it wants a second click */
  #restart:hover { border-color: rgba(232, 201, 138, .5); color: var(--gold); }
  #restart.arming { background: rgba(232, 201, 138, .12); border-color: rgba(232, 201, 138, .6); color: #f0dbaf; }

  /* visually hidden, read aloud: the armed state must reach ears too */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  #agentsbar {
    display: none;
    border-bottom: 1px solid rgba(184, 155, 232, .22);
    background: linear-gradient(180deg, rgba(26, 22, 40, .55), rgba(5, 12, 17, .2));
    flex: none;
  }
  body.agentsopen #agentsbar { display: block; }
  #agentsbar .caption {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 28px 6px;
    font: 500 9.5px/1 var(--mono);
    letter-spacing: .26em; text-transform: uppercase;
    color: rgba(210, 190, 244, .6);
  }
  #agentsbar .caption::after { content: ""; flex: 1; height: 1px; background: rgba(184, 155, 232, .18); }
  #agentrows { display: flex; flex-direction: column; padding: 0 28px 14px; }
  .agent { display: flex; align-items: center; gap: 16px; padding: 11px 0; border-bottom: 1px solid rgba(255, 255, 255, .05); }
  .agent:last-child { border-bottom: none; }
  .agent .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: rgba(143, 168, 179, .9); }
  .agent .kind {
    width: 112px; flex: none;
    font: 600 9.5px/1.3 var(--mono);
    letter-spacing: .2em; text-transform: uppercase;
    color: rgba(182, 198, 205, .8);
    overflow: hidden; text-overflow: ellipsis;
  }
  .agent .main { flex: 1; min-width: 0; }
  .agent .label { font: 400 15px/1.4 var(--serif); color: #eef4f1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .detail { margin-top: 3px; font: 400 10.5px/1.4 var(--mono); color: rgba(223, 230, 230, .35); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .meta { flex: none; font: 400 12px/1 var(--mono); color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .agent.deep .dot { background: var(--st-reasoning); box-shadow: 0 0 10px var(--st-reasoning); animation: br 3.4s ease-in-out infinite; }
  .agent.deep .kind { color: #c8b2f0; }
  .agent.deep .meta { color: rgba(210, 190, 244, .8); }
  .agent.watch .dot { background: var(--st-listening); box-shadow: 0 0 9px var(--st-listening); }
  .agent.watch .kind { color: #a6ecc7; }
  .agent.watch .meta { color: rgba(166, 236, 199, .8); }
  .agent.timer .dot { background: var(--st-speaking); box-shadow: 0 0 9px var(--st-speaking); }
  .agent.timer .kind { color: #c7f4fd; }
  .agent.timer .meta { font-size: 15px; color: #c7f4fd; }
  .agent.alarm .meta { color: rgba(182, 198, 205, .6); }

  /* the readings strip: the world table (world.py), one chip per fact */
  #world {
    display: none;
    flex-wrap: wrap; align-items: center; gap: 8px 10px;
    padding: 8px 28px;
    border-bottom: 1px solid var(--line);
    background: rgba(160, 240, 255, .025);
    flex: none;
  }
  body.hasworld #world { display: flex; }
  #world .reading {
    display: inline-flex; align-items: baseline; gap: 7px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    font: 500 9.5px/1.3 var(--mono);
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
  }
  #world .reading .k { color: rgba(160, 214, 235, .55); }
  #world .reading .age { color: var(--text-faint); letter-spacing: .06em; }
  #world .reading.warn { border-color: rgba(232, 201, 138, .45); color: #f0dbaf; }
  #world .reading.stale { opacity: .55; }
  #world .reading.stale .age { color: rgba(232, 138, 138, .7); }

  /* banners: the machine's own condition, in mono */
  #conn {
    display: none;
    align-items: center; gap: 12px;
    padding: 10px 28px;
    border-bottom: 1px solid rgba(232, 201, 138, .3);
    background: rgba(232, 201, 138, .07);
    font: 500 10.5px/1.4 var(--mono);
    letter-spacing: .16em; text-transform: uppercase;
    color: #f0dbaf;
    flex: none;
  }
  body.disconnected #conn, body.needtoken #conn { display: flex; }
  #conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: br 2.2s ease-in-out infinite; flex: none; }
  body.needtoken #conn .dot { animation: none; }
  /* the token form: shown only when the server closed with 4401 */
  #tokenform { display: none; align-items: center; gap: 8px; margin-left: auto; }
  body.needtoken #tokenform { display: flex; }
  #tokenin {
    font: 500 12px/1.4 var(--mono); letter-spacing: .04em;
    background: rgba(6, 18, 24, .7); color: #dfe6e6;
    border: 1px solid rgba(232, 201, 138, .4); border-radius: 4px;
    padding: 4px 8px; width: 220px; max-width: 45vw;
  }
  #tokenin:focus { outline: none; border-color: var(--gold); }
  #tokenbtn { border: 1px solid rgba(232, 201, 138, .5); border-radius: 4px; padding: 4px 10px; color: #f0dbaf; }
  #tokenbtn:hover { background: rgba(232, 201, 138, .12); }

  #mutebanner {
    display: none;
    align-items: center; gap: 12px;
    padding: 10px 28px;
    border-bottom: 1px solid rgba(143, 168, 179, .22);
    background: rgba(143, 168, 179, .08);
    font: 500 10.5px/1.4 var(--mono);
    letter-spacing: .16em; text-transform: uppercase;
    color: #a9bfc8;
    flex: none;
  }
  body.muted #mutebanner { display: flex; }
  #mutebanner .spacer { flex: 1; }
  #unmute { color: var(--gold); border-bottom: 1px solid rgba(232, 201, 138, .5); padding-bottom: 2px; font: inherit; letter-spacing: inherit; }

  #log { flex: 1; overflow-y: auto; padding: 26px 0 20px; scrollbar-width: thin; scrollbar-color: rgba(140, 240, 255, .2) transparent; }
  .inner { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  #rows { display: flex; flex-direction: column; gap: 22px; }

  .row .body { white-space: pre-wrap; overflow-wrap: break-word; }

  /* you: cut-corner glass, cyan */
  .row.you { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .row.you .body {
    max-width: 66%;
    padding: 11px 16px;
    background: linear-gradient(180deg, rgba(160, 240, 255, .13), rgba(160, 240, 255, .04));
    border: 1px solid var(--glass-border);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    color: #eaf9fb;
    text-wrap: pretty;
  }
  .row.you .cap {
    font: 500 9.5px/1 var(--mono);
    letter-spacing: .18em; text-transform: uppercase;
    color: rgba(160, 214, 235, .42);
  }

  /* ciel: typeset speech — a serif against a gold hairline */
  .row.ciel .body {
    max-width: 82%;
    padding-left: 18px;
    border-left: 1px solid rgba(232, 201, 138, .5);
    font: 400 18px/1.62 var(--serif);
    color: #f7f2e7;
    text-wrap: pretty;
  }

  /* ciel, under its breath: the working notes */
  .row.thinking { display: flex; align-items: baseline; gap: 9px; }
  .row.thinking::before { content: ""; width: 14px; height: 1px; background: rgba(223, 230, 230, .25); flex: none; align-self: center; }
  .row.thinking .body { font: 400 12px/1.5 var(--mono); color: var(--text-faint); }

  /* the historical record of a question that wanted you */
  .row.confirmrow .body {
    max-width: 82%;
    padding-left: 18px;
    border-left: 1px solid rgba(232, 201, 138, .5);
  }
  .row.confirmrow .cap {
    font: 500 9.5px/1 var(--mono);
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 7px;
  }
  .row.confirmrow .q { font: 400 17px/1.5 var(--serif); color: #fbf4e4; text-wrap: pretty; }

  /* events: a labelled hairline across the projection */
  .row.event { display: flex; align-items: center; gap: 14px; }
  .row.event::before, .row.event::after { content: ""; flex: 1; height: 1px; background: var(--gold-line); }
  .row.event .body {
    font: 500 9.5px/1.5 var(--mono);
    letter-spacing: .26em; text-transform: uppercase;
    color: var(--gold-dim);
    text-align: center;
    max-width: 70%;
  }

  /* the live question: gold, glowing, waiting on you */
  #ask {
    display: none;
    padding: 18px 28px;
    border-top: 1px solid rgba(232, 201, 138, .6);
    background: linear-gradient(180deg, rgba(232, 201, 138, .12), rgba(232, 201, 138, .03));
    box-shadow: 0 -14px 50px rgba(232, 201, 138, .1);
    flex: none;
  }
  body.asking #ask { display: block; }
  #ask .arrange { display: flex; align-items: center; gap: 22px; max-width: 1000px; margin: 0 auto; }
  #ask .bar { width: 3px; align-self: stretch; background: var(--gold); box-shadow: 0 0 14px var(--gold); flex: none; }
  #ask .qwrap { flex: 1; min-width: 0; }
  #ask .cap {
    font: 500 9.5px/1 var(--mono);
    letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }
  #ask .q { font: 400 19px/1.45 var(--serif); color: #fdf5e5; text-wrap: pretty; overflow-wrap: break-word; }
  #ask .btns { display: flex; gap: 11px; flex: none; }
  #ask .btns button {
    padding: 14px 32px;
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
    font: 700 11px/1 var(--mono);
    letter-spacing: .22em;
  }
  #ask button.yes { background: rgba(232, 201, 138, .92); color: #231b0c; }
  #ask button.yes:hover { background: var(--gold); }
  #ask button.no { border: 1px solid rgba(223, 230, 230, .3); color: rgba(223, 230, 230, .78); }
  #ask button.no:hover { border-color: rgba(223, 230, 230, .55); color: var(--text); }

  footer {
    display: flex; align-items: flex-end; gap: 12px;
    padding: 14px 28px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: rgba(6, 18, 24, .55);
    flex: none;
  }
  #text {
    flex: 1;
    resize: none;
    max-height: 160px;
    padding: 11px 15px;
    background: rgba(160, 240, 255, .03);
    border: 1px solid rgba(140, 240, 255, .2);
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
    color: var(--text);
    font: 400 14px/1.4 var(--sans);
    outline: none;
  }
  #text::placeholder { color: rgba(223, 230, 230, .32); }
  #text:focus { border-color: rgba(140, 240, 255, .45); }
  #send {
    padding: 12px 22px;
    border: 1px solid rgba(232, 201, 138, .55);
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
    font: 600 10px/1 var(--mono);
    letter-spacing: .22em;
    color: var(--gold);
  }
  #send:hover:not(:disabled) { background: rgba(232, 201, 138, .12); }
  #send:disabled { opacity: .35; cursor: default; }

  @media (max-width: 640px) {
    .corner { display: none; }
    header { gap: 9px; padding: 13px 15px; flex-wrap: wrap; } /* five chips beat 375px — wrap, never clip */
    .brand { gap: 9px; }
    .aperture { width: 22px; height: 22px; }
    .wordmark { font-size: 15px; letter-spacing: .2em; }
    .chip { padding: 5px 10px; font-size: 8.5px; letter-spacing: .16em; gap: 6px; }
    .chip .dot { width: 5px; height: 5px; }
    .long { display: none; }
    #restart.arming .long { display: inline; } /* SURE? must be readable to mean anything */
    #agentsbar .caption, #agentrows { padding-left: 15px; padding-right: 15px; }
    .agent .kind { width: 84px; letter-spacing: .14em; }
    .agent .label { white-space: normal; font-size: 14px; }
    #conn, #mutebanner { padding: 9px 15px; font-size: 9px; letter-spacing: .14em; }
    #world { padding: 7px 15px; gap: 6px 8px; }
    #world .reading { font-size: 8.5px; letter-spacing: .1em; padding: 3px 7px; }
    #log { padding: 20px 0 16px; }
    .inner { padding: 0 16px; }
    #rows { gap: 18px; }
    .row.you .body { max-width: 90%; padding: 10px 14px; font-size: 14px; }
    .row.ciel .body { max-width: 100%; padding-left: 14px; font-size: 17px; line-height: 1.6; }
    .row.thinking .body { font-size: 11.5px; }
    #ask { padding: 16px; }
    #ask .arrange { flex-direction: column; align-items: stretch; gap: 14px; }
    #ask .bar { display: none; }
    #ask .q { font-size: 16px; }
    #ask .btns button { flex: 1; padding: 14px; }
    footer { gap: 10px; padding: 12px 15px calc(12px + env(safe-area-inset-bottom)); }
    #send { padding: 13px 17px; font-size: 9.5px; }
  }
</style>
</head>
<body data-state="idle">

<div id="scan"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<header>
  <div class="brand">
    <svg class="aperture" width="26" height="26" viewBox="0 0 128 128" aria-hidden="true">
      <circle class="c-outer" cx="64" cy="64" r="58" fill="none" stroke-width="5" stroke-dasharray="4 12"/>
      <circle class="c-mid" cx="64" cy="64" r="34" fill="none" stroke-width="5"/>
      <circle class="c-core" cx="64" cy="64" r="10"/>
    </svg>
    <span class="wordmark">Ciel</span>
  </div>
  <span class="chip" id="state"><span class="dot"></span><span id="statelabel">idle</span></span>
  <span class="spacer"></span>
  <button class="chip" id="agentsbtn" hidden title="Everything working on your behalf right now">
    <span id="agentscount"></span><span class="arr" id="agentsarr">▾</span>
  </button>
  <button class="chip" id="mute" title="While muted, Ciel neither speaks nor listens for its name">
    <span>MIC</span><span class="long" id="mutelabel"> · ON</span>
  </button>
  <button class="chip" id="restart" style="display: none" aria-pressed="false" title="Restart Ciel — waits for the current exchange to finish, then relaunches">
    <span aria-hidden="true">↻</span><span class="long" id="restartlabel">RESTART</span>
  </button>
  <span id="srstatus" class="sr" aria-live="assertive"></span>
</header>

<div id="conn"><span class="dot"></span><span id="connlabel">reconnecting to Ciel</span>
  <form id="tokenform" autocomplete="off">
    <input id="tokenin" type="password" placeholder="hub token" aria-label="hub token" autocomplete="off">
    <button id="tokenbtn" type="submit">CONNECT</button>
  </form>
</div>

<div id="world" title="The system's own readings — what Ciel currently holds true, with its age"></div>

<div id="agentsbar">
  <div class="caption">working on your behalf</div>
  <div id="agentrows"></div>
</div>

<div id="mutebanner">
  <span>mic muted — Ciel can't hear you</span>
  <span class="spacer"></span>
  <button id="unmute">unmute</button>
</div>

<div id="log"><div class="inner" id="rows"></div></div>

<div id="ask"><div class="arrange">
  <div class="bar"></div>
  <div class="qwrap">
    <div class="cap">Ciel is asking · waiting on you</div>
    <div class="q" id="askq"></div>
  </div>
  <div class="btns">
    <button class="yes" onclick="answer('yes')">YES</button>
    <button class="no" onclick="answer('no')">NO</button>
  </div>
</div></div>

<footer>
  <textarea id="text" rows="1" placeholder="Type to Ciel — or just speak"></textarea>
  <button id="send" disabled>SEND</button>
</footer>

<script>
"use strict";

const rows = document.getElementById("rows");
const logEl = document.getElementById("log");
const statelabel = document.getElementById("statelabel");
const muteBtn = document.getElementById("mute");
const muteLabel = document.getElementById("mutelabel");
const unmuteBtn = document.getElementById("unmute");
const connLabel = document.getElementById("connlabel");
const askQ = document.getElementById("askq");
const text = document.getElementById("text");
const sendBtn = document.getElementById("send");
const agentsBtn = document.getElementById("agentsbtn");
const agentsArr = document.getElementById("agentsarr");
const agentsCount = document.getElementById("agentscount");
const agentRows = document.getElementById("agentrows");
const worldEl = document.getElementById("world");

const KNOWN_STATES = new Set([
  "idle", "listening", "thinking", "reasoning", "speaking", "error",
]);

function clock(t) {
  const d = new Date(t * 1000);
  return String(d.getHours()).padStart(2, "0") + ":" +
         String(d.getMinutes()).padStart(2, "0");
}

// The transcript's speaker labels, mapped to a shape and a mono caption.
// Labels not listed render as events — new lanes add new labels, and an
// unknown row shown small beats an unknown row lost.
const ROLES = {
  "user":               { cls: "you", cap: (t) => t ? "spoken · " + clock(t) : "spoken" },
  "user-web":           { cls: "you", cap: () => "typed" },
  "user-remote":        { cls: "you", cap: () => "from discord" },
  "you-confirm":        { cls: "you", cap: () => "confirmation" },
  "you-confirm-remote": { cls: "you", cap: () => "confirmation · remote" },
  "ciel":               { cls: "ciel" },
  "ciel-thinking":      { cls: "thinking" },
  "ciel-confirm":       { cls: "confirmrow" },
};

let ws = null;
let muted = false;
let retryMs = 500;
let attempts = 0;

// Who this page is, and where it left off. The id names the client in
// the server's log and outlives the tab; the resume claim — the
// server's epoch and the last seq seen on it — lives with the ack
// ledger in sessionStorage, because a reflexive refresh is exactly the
// moment it matters. A claim the server can't honor (a new process, a
// ring that moved on) costs nothing: the hello comes back fresh, with
// the history window, which is what this page always got.
const clientId = (() => {
  try {
    let id = localStorage.getItem("chartId");
    if (!id) {
      id = "chart-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("chartId", id);
    }
    return id;
  } catch { return "chart"; }
})();
let epoch = null;
let lastSeq = 0;
try {
  const r = JSON.parse(sessionStorage.getItem("resume") || "null");
  if (r && typeof r.epoch === "string" && Number.isInteger(r.seq)) {
    epoch = r.epoch; lastSeq = r.seq;
  }
} catch {}
function saveResume() {
  try { sessionStorage.setItem("resume", JSON.stringify({ epoch, seq: lastSeq })); } catch {}
}

// The hub token: required off loopback, remembered per origin. Asked
// for only when the server says so (close code 4401) — a loopback page
// never sees the form.
function hubToken() {
  try { return localStorage.getItem("hubToken") || ""; } catch { return ""; }
}
const tokenForm = document.getElementById("tokenform");
const tokenIn = document.getElementById("tokenin");
tokenForm.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const t = tokenIn.value.trim();
  if (!t) return;
  try { localStorage.setItem("hubToken", t); } catch {}
  tokenIn.value = "";
  document.body.classList.remove("needtoken");
  connect();
});

function nearBottom() {
  return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
}

// A flapping spoke seat writes "spoke connected" / "spoke disconnected"
// over and over; a retried turn writes "turn failed" twice. Those stack
// onto the previous event row as a count — "spoke disconnected (8×)" —
// rather than fill the page. Two events stack when they say the same
// thing, or when both are seat notices (the run keeps the latest one).
function stacksOn(prev, body) {
  if (!prev || !prev.classList.contains("event")) return false;
  const was = prev.dataset.text || "";
  return was === body || (was.startsWith("spoke ") && body.startsWith("spoke "));
}

function addRow(role, body, t) {
  const stick = nearBottom();
  const spec = ROLES[role] || { cls: "event" };
  if (spec.cls === "event" && stacksOn(rows.lastElementChild, body)) {
    const prev = rows.lastElementChild;
    const n = (Number(prev.dataset.count) || 1) + 1;
    prev.dataset.count = String(n);
    prev.dataset.text = body;
    prev.firstElementChild.textContent = body + " (" + n + "\u00d7)";
    if (stick) logEl.scrollTop = logEl.scrollHeight;
    return;
  }
  const row = document.createElement("div");
  row.className = "row " + spec.cls;
  if (spec.cls === "event") row.dataset.text = body;
  if (spec.cls === "confirmrow") {
    const wrap = document.createElement("div");
    wrap.className = "body";
    const cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = "Ciel is asking";
    wrap.appendChild(cap);
    const q = document.createElement("div");
    q.className = "q";
    q.textContent = body;
    wrap.appendChild(q);
    row.appendChild(wrap);
  } else {
    const div = document.createElement("div");
    div.className = "body";
    div.textContent = body;
    row.appendChild(div);
    if (spec.cap) {
      const cap = document.createElement("div");
      cap.className = "cap";
      cap.textContent = spec.cap(t);
      row.appendChild(cap);
    }
  }
  rows.appendChild(row);
  if (stick) logEl.scrollTop = logEl.scrollHeight;
}

function setState(s) {
  statelabel.textContent = s;
  document.body.dataset.state = KNOWN_STATES.has(s) ? s : "idle";
}

function setMuted(m) {
  muted = m;
  document.body.classList.toggle("muted", m);
  muteLabel.textContent = m ? " · MUTED" : " · ON";
  text.placeholder = m ? "Mic is muted — type instead" : "Type to Ciel — or just speak";
}

// The active-agent roster: everything working on Ciel's side right now.
// Kinds not listed render as plain rows — new agent sources add new
// kinds, the same rule as unknown transcript labels.
const AGENT_KINDS = {
  deep:  { name: "deep thought" },
  watch: { name: "watch" },
  timer: { name: "timer" },
  alarm: { name: "alarm" },
};

let agents = [];

// The world table (world.py): the hub's readings, whole, whenever they
// change — and re-drawn every half minute so the ages stay honest.
// Fact names not listed are simply not shown; a new producer adds a
// line here, the same rule as unknown transcript labels.
let world = {};

function ago(s) {
  s = Math.max(0, Math.round(s));
  if (s < 90) return "now";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

function hm(s) {
  const m = Math.round(s / 60);
  return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0");
}

// name → [key label, value text, warn?] or null to hide. `v` is the fact's
// value, `f` the whole fact (for a place's own timestamp).
const READINGS = {
  spoke: (v) => [v.connected ? "MAC" : "MAC", v.connected ? "linked" : "away", !v.connected],
  presence: (v, f, now) => {
    if (f.ttl_s != null && now - f.observed_at > f.ttl_s) return ["YOU", "unknown", true];
    if (v.locked) return ["YOU", "locked", false];
    if (typeof v.idle_s === "number") return ["YOU", v.idle_s < 120 ? "here" : "idle " + ago(v.idle_s), false];
    return ["YOU", v.present ? "here" : "away", false];
  },
  place: (v) => [v.via === "findmy" ? "PHONE" : "PLACE", v.place || (v.network ? v.network : "unknown"), false],
  timers: (v) => Array.isArray(v) && v.length ? ["TIMERS", String(v.length), false] : null,
  watches: (v) => Array.isArray(v) && v.length ? ["WATCHES", String(v.length), false] : null,
  agenda: (v, f, now) => {
    const d = new Date(now * 1000);
    const today = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    if (v.day !== today) return null;
    const lines = Array.isArray(v.lines) ? v.lines : [];
    return ["NEXT", lines.length ? lines[0] : "nothing more today", false];
  },
  oura: (v) => {
    const bits = [];
    if (typeof v.readiness === "number") bits.push("ready " + v.readiness);
    if (typeof v.sleep_s === "number") bits.push("slept " + hm(v.sleep_s));
    else if (typeof v.sleep_score === "number") bits.push("sleep " + v.sleep_score);
    return bits.length ? ["RING", bits.join(" · "), false] : null;
  },
  sections: (v) => {
    const spots = v && v.spots ? v.spots : {};
    const open = Object.entries(spots).filter(([, n]) => n > 0);
    if (!Object.keys(spots).length) return null;
    return ["SECTIONS", open.length ? open.map(([id, n]) => id + ": " + n).join(" ") : "all full", open.length > 0];
  },
  hold: (v) => v ? ["VIGIL", "held", true] : null,
};

function setWorld(facts) {
  world = facts && typeof facts === "object" ? facts : {};
  renderWorld();
}

function renderWorld() {
  const now = Date.now() / 1000;
  worldEl.textContent = "";
  let shown = 0;
  for (const name of Object.keys(READINGS)) {
    const f = world[name];
    if (!f || typeof f !== "object") continue;
    let spec;
    try { spec = READINGS[name](f.value, f, now); } catch { spec = null; }
    if (!spec) continue;
    const stale = f.ttl_s != null && now - f.observed_at > f.ttl_s;
    // A place's own reading time is the honest age, not when it was folded in.
    const at = name === "place" && f.value && typeof f.value.at === "number" ? f.value.at : f.observed_at;
    const chip = document.createElement("span");
    chip.className = "reading" + (spec[2] ? " warn" : "") + (stale ? " stale" : "");
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = spec[0];
    chip.appendChild(k);
    const val = document.createElement("span");
    val.textContent = spec[1];
    chip.appendChild(val);
    const age = now - at;
    if (age >= 90 || stale) {
      const a = document.createElement("span");
      a.className = "age";
      a.textContent = ago(age);
      chip.appendChild(a);
    }
    chip.title = name + " · " + (f.source || "?") + " · " + new Date(f.observed_at * 1000).toLocaleTimeString();
    worldEl.appendChild(chip);
    shown += 1;
  }
  document.body.classList.toggle("hasworld", shown > 0);
}

setInterval(renderWorld, 30000);

function fmtSpan(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  return Math.floor(m / 60) + "h " + (m % 60) + "m";
}

function fmtClock(s) {
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function setAgents(list) {
  agents = Array.isArray(list) ? list : [];
  renderAgents();
}

function renderAgents() {
  if (!agents.length) {
    agentsBtn.hidden = true;
    document.body.classList.remove("agentsopen");
    agentRows.textContent = "";
    return;
  }
  agentsBtn.hidden = false;
  agentsCount.textContent = agents.length + " WORKING";
  // The chip runs deep-thought purple while a reasoning pass is in
  // flight — that is the one agent someone is sitting in silence for.
  agentsBtn.classList.toggle("deep", agents.some((a) => a.kind === "deep"));
  agentsArr.textContent =
    document.body.classList.contains("agentsopen") ? "▴" : "▾";
  if (!document.body.classList.contains("agentsopen")) return;

  const now = Date.now() / 1000;
  agentRows.textContent = "";
  for (const a of agents) {
    const spec = AGENT_KINDS[a.kind] || { name: a.kind || "agent" };
    const row = document.createElement("div");
    row.className = "agent" + (AGENT_KINDS[a.kind] ? " " + a.kind : "");
    const dot = document.createElement("span");
    dot.className = "dot";
    row.appendChild(dot);
    const kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = spec.name;
    row.appendChild(kind);
    const main = document.createElement("div");
    main.className = "main";
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = a.label || spec.name;
    main.appendChild(label);
    if (a.detail) {
      const detail = document.createElement("div");
      detail.className = "detail";
      detail.textContent = a.detail;
      main.appendChild(detail);
    }
    row.appendChild(main);
    const parts = [];
    if (a.since != null) parts.push(fmtSpan(now - a.since) + " in");
    if (a.until != null) {
      if (now >= a.until) parts.push("due");
      else if (a.kind === "timer" && a.until - now < 3600)
        parts.push(fmtClock(a.until - now));
      else parts.push(fmtSpan(a.until - now) + " left");
    }
    if (parts.length) {
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = parts.join(" · ");
      row.appendChild(meta);
    }
    agentRows.appendChild(row);
  }
}

agentsBtn.addEventListener("click", () => {
  document.body.classList.toggle("agentsopen");
  renderAgents();
});
// Tick the countdowns while the list is showing; the chip alone needs no
// clock, and the server re-sends the roster whenever it actually changes.
setInterval(() => {
  if (agents.length && document.body.classList.contains("agentsopen"))
    renderAgents();
}, 1000);

function clearAsk() { document.body.classList.remove("asking"); }

function sendFrame(obj) {
  // Refuses rather than drops: the caller keeps what it was trying to
  // send. A frame written to a CONNECTING or CLOSING socket is a message
  // the user watched themselves send that never existed. The one dead
  // state this test cannot see — OPEN in the browser, long since dropped
  // by the server, the parting gift of a sleeping machine — is covered
  // for says by the ack ledger below, and shortened for everything else
  // by the liveness probe.
  if (!ws || ws.readyState !== WebSocket.OPEN) return false;
  ws.send(JSON.stringify(obj));
  return true;
}

// The ack ledger: every say carries a seq and stays here until the
// server's receipt comes back; a reconnect resends whatever is still
// owed. So a message written into a half-open socket arrives late, never
// voided. At-least-once on purpose: the rare double (say delivered, ack
// lost) is a visible, cheap failure where the void was a silent one.
// sessionStorage backs the ledger because the half-open state it exists
// for is exactly what provokes a reflexive refresh — the debts must
// outlive the page. And the whole scheme waits for a hello that says
// acks: this page is served from disk, so it can be newer than the
// process behind the socket, and an ack-less server would leave every
// say owed forever while the probe shot healthy sockets.
let acks = false; // what the hello said this server speaks
let saySeq = 0;
const unacked = new Map(); // seq → text; insertion order is send order
try {
  for (const [seq, t] of JSON.parse(sessionStorage.getItem("unacked") || "[]")) {
    unacked.set(seq, t);
    saySeq = Math.max(saySeq, seq);
  }
} catch {}

function saveLedger() {
  try { sessionStorage.setItem("unacked", JSON.stringify([...unacked])); } catch {}
}

function say(t) {
  if (!acks) {
    // No hello yet, or an older server: the pre-ledger lane, fire-and-forget.
    if (!sendFrame({ type: "say", text: t })) return false;
  } else {
    const seq = ++saySeq;
    if (!sendFrame({ type: "say", text: t, seq })) return false;
    unacked.set(seq, t);
    saveLedger();
  }
  clearAsk(); // whatever was pending, this line is the user's word on it
  return true;
}

// A confirm answer rides outside the ledger on purpose: a resend would
// arrive freshly stamped, and the pipeline answers whatever question is
// open *now* — a stale yes must never authorize a question the user
// never saw. A swallowed answer is merely an unanswered question, and
// the broker's timeout owns that case with the safe default.
function answer(word) {
  if (!sendFrame({ type: "say", text: word })) return;
  clearAsk();
}

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/ws`);

  ws.onopen = () => {
    retryMs = 500;
    attempts = 0;
    document.body.classList.remove("disconnected");
    sendBtn.disabled = false;
    // Capabilities reset until this server's hello claims them — a say
    // sent in the gap rides seq-less rather than joining a ledger the
    // hello is about to resend (the double would be manufactured here).
    acks = false;
    // The client speaks first: who, the proof, and where it left off.
    const hello = { type: "hello", v: 1, role: "chart", client_id: clientId, caps: ["acks", "resume"] };
    const token = hubToken();
    if (token) hello.token = token;
    if (epoch !== null) hello.resume = { epoch, seq: lastSeq };
    sendFrame(hello);
  };

  ws.onmessage = (ev) => {
    clearProbe(); // any inbound frame is proof of life
    let f;
    try { f = JSON.parse(ev.data); } catch { return; }
    if (f.type !== "hello" && f.type !== "ack" && Number.isInteger(f.seq)) {
      lastSeq = f.seq; // every broadcast frame moves the resume claim
      saveResume();
    }
    if (f.type === "hello") {
      // The capability handshake: the ledger, the probe, and the restart
      // chip all wait for the server to say it speaks them.
      acks = !!f.acks;
      restartBtn.style.display = acks ? "" : "none";
      if (acks) {
        // Settle the ledger: whatever the last socket swallowed rides again.
        for (const [seq, t] of unacked) sendFrame({ type: "say", text: t, seq });
      } else if (unacked.size) {
        unacked.clear(); // debts an ack-less server can never settle
        saveLedger();
      }
      if (typeof f.epoch === "string") {
        epoch = f.epoch;
        lastSeq = Number.isInteger(f.seq) ? f.seq : 0;
        saveResume();
      }
      if (!f.resumed) {
        // A fresh picture: the history window replaces whatever was
        // drawn. A resumed one keeps the screen — the frames this page
        // missed follow the hello one by one, as if nothing dropped.
        rows.textContent = "";
        for (const r of f.history || []) addRow(r.role, r.text, r.t);
        logEl.scrollTop = logEl.scrollHeight;
      }
      setState(f.state || "idle");
      setMuted(!!f.muted);
      setAgents(f.agents);
      setWorld(f.world);
    } else if (f.type === "row") {
      addRow(f.role, f.text, f.t);
      if (f.role && f.role.startsWith("you-confirm")) clearAsk();
    } else if (f.type === "state") {
      setState(f.state);
      if (f.state === "idle") clearAsk(); // the question expired with its turn
    } else if (f.type === "muted") {
      setMuted(!!f.muted);
    } else if (f.type === "agents") {
      setAgents(f.agents);
    } else if (f.type === "world") {
      setWorld(f.facts);
    } else if (f.type === "confirm") {
      askQ.textContent = f.text;
      document.body.classList.add("asking");
      const stick = nearBottom();
      if (stick) logEl.scrollTop = logEl.scrollHeight;
    } else if (f.type === "ack") {
      unacked.delete(f.seq);
      saveLedger();
    }
  };

  ws.onclose = (ev) => {
    attempts += 1;
    document.body.classList.add("disconnected");
    sendBtn.disabled = true;
    clearAsk();
    clearProbe(); // a pending deadline must not shoot the next socket
    disarmRestart(); // an armed chip must not survive into the fresh process
    if (ev && ev.code === 4401) {
      // The server wants the hub token — this page is off loopback.
      // No retry loop: the form reconnects when the user submits.
      connLabel.textContent = hubToken() ? "hub token refused" : "hub token needed";
      document.body.classList.add("needtoken");
      tokenIn.focus();
      return;
    }
    connLabel.textContent = attempts > 1
      ? "reconnecting to Ciel · attempt " + attempts
      : "reconnecting to Ciel";
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 8000);
  };
  ws.onerror = () => ws.close();
}

function submit() {
  const t = text.value.trim();
  if (!t) return;
  if (!say(t)) return; // not connected — keep the draft; the banner says why
  text.value = "";
  text.style.height = "auto";
  text.focus();
}

sendBtn.addEventListener("click", submit);
text.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); submit(); }
});
text.addEventListener("input", () => {
  text.style.height = "auto";
  text.style.height = Math.min(text.scrollHeight, 160) + "px";
});
muteBtn.addEventListener("click", () => sendFrame({ type: "mute", muted: !muted }));
unmuteBtn.addEventListener("click", () => sendFrame({ type: "mute", muted: false }));

// The restart chip arms on the first click and fires on the second — a
// stray click must not cost the mic and the models a relaunch. The server
// answers with an event row, and the reconnect banner narrates the rest.
const restartBtn = document.getElementById("restart");
const restartLabel = document.getElementById("restartlabel");
const srStatus = document.getElementById("srstatus");
let restartArm = null;
let restartArmedAt = 0;

function disarmRestart() {
  if (restartArm !== null) clearTimeout(restartArm);
  restartArm = null;
  restartBtn.classList.remove("arming");
  restartBtn.setAttribute("aria-pressed", "false");
  restartBtn.style.minWidth = "";
  restartLabel.textContent = "RESTART";
  srStatus.textContent = "";
}

restartBtn.addEventListener("click", () => {
  if (restartArm === null) {
    // Freeze the hit target: the shorter armed label must not shift the
    // chip row under a cursor that is about to click again.
    restartBtn.style.minWidth = restartBtn.offsetWidth + "px";
    restartBtn.classList.add("arming");
    restartBtn.setAttribute("aria-pressed", "true");
    restartLabel.textContent = "SURE?";
    srStatus.textContent = "Armed — press again to restart Ciel";
    restartArmedAt = Date.now();
    restartArm = setTimeout(disarmRestart, 4000);
    return;
  }
  // A second click this fast is a bounce or a habitual double-click, not
  // a decision — SURE? was never readable. The arm stands; a real second
  // click still fires.
  if (Date.now() - restartArmedAt < 350) return;
  // Refused (reconnecting): stay armed rather than disarm into a look
  // identical to success — the caller keeps what it was trying to send.
  if (!sendFrame({ type: "restart" })) return;
  disarmRestart();
});

// The liveness probe: ask the server for any frame at all. A browser can
// hold a socket OPEN long after the far side gave up on it (the machine
// slept, the tab was frozen), and protocol-level pings are invisible to
// page script — so ask at the app layer. No answer inside the deadline
// means the socket is a ghost: close it, and the usual reconnect path
// (with the ledger resend) does the rest.
let probeDeadline = null;

function clearProbe() {
  if (probeDeadline !== null) clearTimeout(probeDeadline);
  probeDeadline = null;
}

function verifyLink() {
  // Gated on acks: a server that never pongs would make every probe
  // shoot a healthy socket.
  if (!acks || !ws || ws.readyState !== WebSocket.OPEN || probeDeadline !== null) return;
  sendFrame({ type: "ping" });
  probeDeadline = setTimeout(() => { probeDeadline = null; ws.close(); }, 3000);
}

// When to suspect the socket: coming back to the tab (a bfcache restore
// lands here too), and a slow heartbeat that catches the rest — a
// machine-level sleep under a page that stayed visible, a peer gone
// without a FIN. Hidden tabs are left alone: their timers throttle by
// design, and the visibility handler probes the moment they matter again.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") verifyLink();
});
setInterval(() => {
  if (document.visibilityState === "visible") verifyLink();
}, 15000);

connect();
</script>
</body>
</html>
