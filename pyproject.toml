[project]
name = "ciel"
version = "0.1.0"
description = "Ciel — a local-first voice assistant"
readme = "README.md"
authors = [
    { name = "iiChoco", email = "chocowhitemc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Brain — authenticates via Claude subscription OAuth, not an API key.
    "claude-agent-sdk>=0.1.0",
    # Audio I/O
    "sounddevice>=0.5.1",
    "numpy>=2.1",
    # Endpointing: knowing when the user stopped talking
    "webrtcvad-wheels>=2.0.14",
    # Speech-to-text, local
    "faster-whisper>=1.1.0",
    # Wake word, local
    "openwakeword>=0.6.0",
    "onnxruntime>=1.20",
    # Floating on-screen indicator. Pinned explicitly rather than relying on
    # the system Python having it — `import AppKit` currently resolves through
    # system site-packages, which would vanish the moment the venv is made
    # strictly isolated.
    "pyobjc-framework-Cocoa>=10.1",
]

[project.optional-dependencies]
# Better-sounding TTS than macOS `say`. Optional so v1 runs with zero downloads.
piper = ["piper-tts>=1.7.0"]

[project.scripts]
ciel = "ciel.__main__:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Ciel targets macOS. Restricting resolution to darwin also sidesteps
# openwakeword's Linux-only tflite-runtime dependency, which has no wheels for
# Python 3.12+ — and we run openWakeWord under onnxruntime anyway, since the
# tflite runtime is unreliable on Apple Silicon.
environments = ["sys_platform == 'darwin'"]

[tool.uv.build-backend]
module-root = "src"
