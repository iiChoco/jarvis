[project]
name = "ciel"
version = "0.1.0"
description = "Ciel — a local-first voice assistant"
readme = "README.md"
authors = [
    { name = "iiChoco", email = "chocowhitemc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Brain — authenticates via Claude subscription OAuth, not an API key.
    "claude-agent-sdk>=0.1.0",
    # Shared arithmetic (the wire's ring tones, the confirm broker's RMS).
    "numpy>=2.1",
]

# The room's half and the brain's half. Everything the microphone and
# the Mac need lives in the `spoke` group; the hub's own extras in `hub`.
# `spoke` is a default group, so a plain `uv sync` on this Mac installs
# exactly what it always did; a server runs
# `uv sync --no-default-groups --group hub --extra discord --extra web`
# and never sees a sound device or a pyobjc wheel.
[dependency-groups]
spoke = [
    # Audio I/O
    "sounddevice>=0.5.1; sys_platform == 'darwin'",
    # Endpointing: knowing when the user stopped talking
    "webrtcvad-wheels>=2.0.14; sys_platform == 'darwin'",
    # Speech-to-text, local. mlx-whisper is the default engine (Metal GPU);
    # faster-whisper stays installed as the CPU fallback build_stt reaches for.
    "mlx-whisper>=0.4.2; sys_platform == 'darwin'",
    "faster-whisper>=1.1.0; sys_platform == 'darwin'",
    # Wake word, local
    "openwakeword>=0.6.0; sys_platform == 'darwin'",
    "onnxruntime>=1.20; sys_platform == 'darwin'",
    # Floating on-screen indicator. Pinned explicitly rather than relying on
    # the system Python having it — `import AppKit` currently resolves through
    # system site-packages, which would vanish the moment the venv is made
    # strictly isolated.
    "pyobjc-framework-Cocoa>=10.1; sys_platform == 'darwin'",
    # Screen look: preflights macOS Screen Recording permission before a
    # capture, because `screencapture` without the grant silently omits every
    # window instead of failing.
    "pyobjc-framework-Quartz>=10.1; sys_platform == 'darwin'",
    # Contact resolution: an in-process CNContactStore query (<50 ms) instead
    # of driving Contacts.app over AppleScript (1-4 s, and it launches the
    # app). The AppleScript path survives as the fallback.
    "pyobjc-framework-Contacts>=10.1; sys_platform == 'darwin'",
    # Calendar proximity nudges (Vigil): EventKit reads the local calendar
    # store in-process — AppleScript against Calendar.app takes seconds and
    # launches the app, and the store's SQLite schema churns across macOS
    # releases. Needs the one-time Calendars permission on first use.
    "pyobjc-framework-EventKit>=10.1; sys_platform == 'darwin'",
    # Where this machine is (Vigil's location watcher, the where_am_i tool):
    # CoreLocation's Wi-Fi positioning, in-process. Needs the one-time
    # Location Services permission for the Python that runs Ciel.
    "pyobjc-framework-CoreLocation>=10.1; sys_platform == 'darwin'",
]
hub = [
    # The wire server (the Chart, the spoke's seat).
    "aiohttp>=3.10",
]

[project.optional-dependencies]
# Better-sounding TTS than macOS `say`. Optional so v1 runs with zero downloads.
piper = ["piper-tts>=1.7.0"]
# Speaker verification (the Barn Door gate): embeds utterances with an ONNX
# speaker model so Ciel can tell the enrolled voice from anyone else's.
# Optional for the same reason piper is — Ciel runs without it, just
# without the gate. Pinned below 1.11: the 1.11+ macOS wheels ship without
# libonnxruntime.dylib and fail at import (verified 1.11.5-1.13.5 broken,
# 1.10.46 fine).
voice = ["sherpa-onnx>=1.10,<1.11"]
# The Discord lane (Parallel Transport): texting Ciel from anywhere.
# Optional like the others — without it the lane logs one warning and
# stays off.
discord = ["discord.py>=2.4"]
# The web GUI (Chart): a local chat page onto the running assistant, with
# the mute switch for rooms that must stay quiet. Optional for the same
# reason — without it the lane logs one warning and stays off.
web = ["aiohttp>=3.10"]

[project.scripts]
ciel = "ciel.__main__:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["spoke"]
# The room's half resolves on macOS only (every `spoke` requirement carries
# a darwin marker: openwakeword's Linux-only tflite-runtime dependency has
# no wheels for Python 3.12+, and mlx and pyobjc are Apple-only anyway); the
# brain's half resolves on Linux too, for the hub's server.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.uv.build-backend]
module-root = "src"
